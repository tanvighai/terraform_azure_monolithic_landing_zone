# more precisely, single implicit stage + single job + 3 steps

trigger:
- main

pool:
  name: agentpool1 

steps:
- script : |
    terraform --version

  displayName: "terraform ka version check krna"


- script : |
    terraform init

  displayName: "terraform init kr be"


- script : |
    az --version

  displayName: "check azure cli"


- script: |
    git --version
  displayName: "Check Git Version"

